<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulasi TTD Supplier</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: satu kolom HP; banner simulasi → chat WA → halaman TTD → hasil PDF */
:root{
  --bg:#e9edf2; --card:#ffffff; --fg:#14202e; --muted:#5a6878; --line:#d3dae3;
  --navy:#1f3a5f; --navy-fg:#ffffff; --soft:#e4e9f0;
  --wa:#1fa855; --wa-bg:#efe7dc; --wa-in:#ffffff; --wa-out:#d9fdd3; --wa-fg:#111b21;
  --ok:#1a7f4b; --ok-bg:#e3f3ea; --err:#b42318; --err-bg:#fde8e7; --warn-bg:#fff4dc; --warn:#7a4b00;
  --pad-bg:#ffffff; --ink:#0b1b33;
  --f-ui:"Plus Jakarta Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151d; --card:#18212c; --fg:#e7edf4; --muted:#9aa8b8; --line:#2b3746;
  --navy:#4f7fbf; --navy-fg:#ffffff; --soft:#243041;
  --wa:#25c063; --wa-bg:#0b141a; --wa-in:#202c33; --wa-out:#005c4b; --wa-fg:#e9edef;
  --ok:#5fd394; --ok-bg:#163527; --err:#ff9b8f; --err-bg:#3a1b1a; --warn-bg:#3a2d12; --warn:#f2c46b;
  --pad-bg:#ffffff; --ink:#0b1b33; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151d; --card:#18212c; --fg:#e7edf4; --muted:#9aa8b8; --line:#2b3746;
  --navy:#4f7fbf; --navy-fg:#ffffff; --soft:#243041;
  --wa:#25c063; --wa-bg:#0b141a; --wa-in:#202c33; --wa-out:#005c4b; --wa-fg:#e9edef;
  --ok:#5fd394; --ok-bg:#163527; --err:#ff9b8f; --err-bg:#3a1b1a; --warn-bg:#3a2d12; --warn:#f2c46b;
  --pad-bg:#ffffff; --ink:#0b1b33; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sim{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.sim b{font-weight:700}
.steps{display:flex;gap:6px}
.steps span{flex:1;height:5px;border-radius:9px;background:var(--line)}
.steps span.on{background:var(--navy)}
.card{background:var(--card);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pill{align-self:flex-start;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--navy-fg);background:var(--navy);padding:3px 10px;border-radius:999px}
h2{margin:0;font-size:20px;font-weight:800;letter-spacing:.02em;text-wrap:balance}
.muted{color:var(--muted);font-size:13px}
p{margin:0}
table{width:100%;border-collapse:collapse}
.info td{padding:3px 0;vertical-align:top;font-size:14px}
.info td:first-child{color:var(--muted);width:40%;padding-right:8px}
.tblwrap{overflow-x:auto}
.items th{background:var(--soft);color:var(--fg);font-size:12px;padding:7px 6px;text-align:left;font-weight:700}
.items td{border-bottom:1px solid var(--line);padding:7px 6px;font-size:13px;font-variant-numeric:tabular-nums}
.r{text-align:right!important;white-space:nowrap}.c{text-align:center!important}
.tot td{border-bottom:none;font-weight:700}
ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.padhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:14px}
canvas{width:100%;height:170px;border:2px dashed var(--muted);border-radius:12px;background:var(--pad-bg);touch-action:none;display:block}
canvas.signed{border-style:solid;border-color:var(--navy)}
.hint{font-size:12.5px;color:var(--muted)}
.btn{appearance:none;border:none;border-radius:11px;padding:13px 16px;font:600 15px var(--f-ui);cursor:pointer;width:100%;text-align:center;text-decoration:none;display:block}
.btn:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.btn-primary{background:var(--navy);color:var(--navy-fg)}
.btn-wa{background:var(--wa);color:#fff}
.btn-ghost{background:var(--soft);color:var(--fg)}
.btn-sm{width:auto;padding:6px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:default}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--navy)}
.msg{padding:10px 12px;border-radius:9px;font-size:14px}
.msg.err{background:var(--err-bg);color:var(--err)}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
/* WA mock */
.wa{background:var(--wa-bg);border-radius:14px;overflow:hidden;color:var(--wa-fg)}
.wa-top{background:var(--wa);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;font-weight:700}
.wa-ava{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:13px}
.wa-top small{display:block;font-weight:400;opacity:.85;font-size:12px}
.wa-body{padding:12px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:86%;padding:8px 10px 6px;border-radius:10px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.bub.in{background:var(--wa-in);align-self:flex-start;border-top-left-radius:2px}
.bub.out{background:var(--wa-out);align-self:flex-end;border-top-right-radius:2px}
.bub .t{display:block;text-align:right;font-size:11px;opacity:.6;margin-top:2px}
.bub a.lnk{color:#2f7fd8;text-decoration:underline;cursor:pointer}
.doc{display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.06);border-radius:8px;padding:8px;white-space:normal}
.doc .ic{width:34px;height:40px;border-radius:4px;background:#e2463b;color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;flex:none}
.done-ic{width:56px;height:56px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;font-size:28px;font-weight:800;align-self:center}
.center{text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1;min-width:140px}
#paper{border-radius:10px;overflow:hidden}
@media (prefers-reduced-motion:no-preference){.card,.wa{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.fld input,.fld select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font:15px var(--f-ui);background:var(--card);color:var(--fg)}
.fld input:focus,.fld select:focus{outline:2px solid var(--navy);outline-offset:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stack{display:flex;flex-direction:column;gap:8px}
.it{border:1px solid var(--line);border-radius:11px;padding:10px;position:relative;display:flex;flex-direction:column;gap:8px}
.g-it{display:grid;grid-template-columns:1fr 64px;gap:8px;padding-right:22px}
.g-it2{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.i-s{font-size:13px;color:var(--muted);padding-bottom:12px;font-variant-numeric:tabular-nums}
.x{position:absolute;top:4px;right:6px;border:none;background:none;font-size:20px;color:var(--muted);cursor:pointer;line-height:1;padding:4px}
.sumrow{display:flex;justify-content:space-between;font-size:15px;font-variant-numeric:tabular-nums}
.sumrow.big{font-weight:800;font-size:17px;border-top:1px solid var(--line);padding-top:10px}
#app{display:flex;flex-direction:column;gap:14px}
.linkbox{word-break:break-all;background:var(--soft);border-radius:9px;padding:10px;font-size:13px}
.badge{display:inline-block;background:var(--warn-bg);color:var(--warn);font-weight:700;border-radius:999px;padding:2px 9px;font-size:12px}
.paste{border:2px dashed var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 12px;font:600 13px var(--f-ui);cursor:pointer}
.chip.on{background:var(--navy);color:var(--navy-fg);border-color:var(--navy)}
.chip:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
textarea#f_paste{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--card);color:var(--fg);resize:vertical;min-width:0}
.msg.warn{background:var(--warn-bg);color:var(--warn);margin-top:8px}
.bm{border:2px solid var(--navy)}
details.card>summary{cursor:pointer;list-style:none}
details.card>summary::-webkit-details-marker{display:none}
details.card:not([open]){gap:0}
.demo-note{font-style:italic}
.modes{display:flex;flex-direction:column;gap:6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--soft);padding:4px;border-radius:12px}
.seg-b{appearance:none;border:none;background:transparent;color:var(--fg);font:600 13.5px var(--f-ui);padding:9px 4px;border-radius:9px;cursor:pointer}
.seg-b.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--navy)}
.seg-b:focus-visible,.tx:focus-visible,.cs:focus-visible,.linkbtn:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.linkbtn{appearance:none;border:none;background:none;color:var(--muted);font:600 12.5px var(--f-ui);text-decoration:underline;cursor:pointer;align-self:center;padding:2px}
.ttl{font-weight:800;font-size:17px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.cnt{font-size:12.5px;font-weight:600;color:var(--muted)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:11px;padding:0 12px;background:var(--card)}
.search input{border:none;outline:none;background:transparent;color:var(--fg);font:15px var(--f-ui);padding:12px 0;width:100%;min-width:0}
.txlist{display:flex;flex-direction:column;gap:6px}
.txlist.short{max-height:420px;overflow:auto}
.daylbl{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.tx{appearance:none;display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:11px 12px;cursor:pointer;font:inherit}
.tx:active{transform:scale(.99)}
.tx-l,.tx-r{display:flex;flex-direction:column;gap:3px;min-width:0}
.tx-r{align-items:flex-end;flex:none}
.tx-name{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-meta{font-size:12px;color:var(--muted)}
.tx-tot{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.tag{font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 8px}
.tag-mp{background:var(--warn-bg);color:var(--warn)}
.tag-ln{background:var(--ok-bg);color:var(--ok)}
.empty{color:var(--muted);font-size:13.5px;padding:12px 0;text-align:center}
.sumc{display:flex;flex-direction:column;gap:8px}
.sum-name{font-weight:800;font-size:18px;line-height:1.25}
.sum-items{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.sum-items.compact{max-height:210px;overflow:auto}
.sum-it{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:start}
.sum-it .q{color:var(--muted)}.sum-it .s{font-variant-numeric:tabular-nums;white-space:nowrap}
.sum-tot{display:flex;justify-content:space-between;font-size:16px;padding-top:2px}
.inp{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.flbl{font-size:13px;color:var(--muted)}
.chipsel{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cs{appearance:none;border:1.5px solid var(--line);background:var(--card);color:var(--fg);border-radius:11px;padding:12px 8px;font:600 14px var(--f-ui);cursor:pointer}
.cs.on{border-color:var(--navy);background:var(--navy);color:var(--navy-fg)}
.kfix{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px}
#sheetwrap{position:fixed;inset:0;z-index:50}
#sheetwrap .dim{position:absolute;inset:0;background:rgba(10,18,30,.45);opacity:0;transition:opacity .2s}
#sheetwrap .sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;transform:translateY(100%);transition:transform .25s ease-out;max-width:620px;margin:0 auto}
#sheetwrap.open .dim{opacity:1}#sheetwrap.open .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);align-self:center}
.xbtn{position:absolute;top:8px;right:12px;border:none;background:none;font-size:26px;color:var(--muted);cursor:pointer}
.wiz{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.wz{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.wz span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--muted);font-weight:800}
.wz.on{color:var(--navy)}.wz.on span{background:var(--navy);color:var(--navy-fg)}
.row2b{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.mini{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px}
.picked{appearance:none;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--navy);background:var(--card);color:var(--fg);border-radius:12px;padding:10px 12px;font:inherit;cursor:pointer}
.chg{color:var(--navy);font-weight:700;font-size:13px}
.stickybar{position:sticky;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 18px rgba(0,0,0,.12);font-variant-numeric:tabular-nums}
.stickybar .btn{width:auto;padding:12px 22px}
.demo-pick{display:flex;flex-direction:column;gap:6px;background:var(--warn-bg);border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--warn)}
.seg2,.seg3{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--soft);padding:4px;border-radius:11px}
.s2,.s3{appearance:none;border:none;background:transparent;color:var(--fg);font:600 13px var(--f-ui);padding:9px 4px;border-radius:8px;cursor:pointer}
.s2.on,.s3.on{background:var(--card);color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.s3 b{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--navy);color:var(--navy-fg);font-size:11.5px}
.tag-done{background:var(--ok-bg);color:var(--ok)}
.tx-done{border-color:var(--ok);background:color-mix(in srgb,var(--ok-bg) 45%,var(--card))}
.pull-space{height:150px}
.pull{position:fixed;left:0;right:0;bottom:0;z-index:20;max-width:620px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -8px 28px rgba(0,0,0,.18);display:flex;flex-direction:column;transition:height .25s cubic-bezier(.3,.1,.2,1)}
.pull.dragging{transition:none}
.pull-h{flex:none;padding:10px 16px 8px;cursor:grab;touch-action:none;user-select:none;border-bottom:1px solid var(--line)}
.grab2{width:52px;height:6px;border-radius:9px;background:var(--muted);opacity:.55;margin:0 auto 6px}
.pull-t{text-align:center;font-size:12.5px;color:var(--muted);font-weight:600}
.pull-c{flex:none;display:flex;flex-direction:column;gap:8px;padding:8px max(16px,env(safe-area-inset-left,0px)) 4px}
.pull-c .search{margin:0}
.pull-b{flex:1;overflow:auto;padding:6px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain}
.geser{gap:8px}
.dates{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.dates::-webkit-scrollbar{display:none}
.dp{appearance:none;flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:64px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:6px 8px;font:12px var(--f-ui);cursor:pointer}
.dp b{font-size:14px}.dp small{color:var(--muted)}
.dp.on{border-color:var(--navy);background:var(--navy);color:var(--navy-fg)}.dp.on small{color:var(--navy-fg);opacity:.8}
.pages{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;gap:0}
.pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;display:flex;flex-direction:column;gap:6px;max-height:62vh;overflow-y:auto;padding:0 2px}
.tx-direct{border-left:4px solid var(--ok)}
.dp i{font-style:normal;color:var(--err);font-weight:700}.dp.on i{color:#ffd6d2}
.seg2.three{grid-template-columns:repeat(3,1fr)}
.warnbox{border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;border:1.5px solid}
.warnbox.w1{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.warnbox.w2,.warnbox.w3{background:var(--err-bg);color:var(--err);border-color:var(--err)}
.wb-t{font-weight:800;font-size:15px}.wb-s{font-size:13px}
.wb-a{display:flex;gap:8px;flex-wrap:wrap}
.wb-btn{background:var(--err);color:#fff}
.warnbox.w1 .wb-btn{background:var(--warn);color:#fff}
.age{display:inline-block;margin-top:3px;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;width:max-content}
.age.w1{background:var(--warn-bg);color:var(--warn)}.age.w2{background:#fde3cf;color:#9a3d00}.age.w3{background:var(--err-bg);color:var(--err)}
.tx.w3{border-left-color:var(--err);border-color:var(--err)}.tx.w2{border-left-color:#d9822b}
.warnpill{border:none;background:var(--err);color:#fff;font:700 12px var(--f-ui);border-radius:999px;padding:5px 10px;cursor:pointer}
#popwarn{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px}
#popwarn .dim{position:absolute;inset:0;background:rgba(10,18,30,.55)}
#popwarn .pop{position:relative;background:var(--card);color:var(--fg);border-radius:18px;padding:18px 16px;max-width:420px;width:100%;max-height:86vh;overflow:auto;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.pop-ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:28px;font-weight:900;margin:0 auto;color:#fff;background:var(--err)}
.pop-ic.w1{background:var(--warn)}
.pop-list{display:flex;flex-direction:column;gap:6px}
.pop-it{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:9px 10px;font-size:13.5px}
.pop-it>div{min-width:0}.pop-it b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop-it .btn{flex:none}
.kitbtn{width:100%;margin:6px 0}
.kitvid{border-radius:12px;overflow:hidden;background:#000;width:min(200px,55vw);margin:10px auto}
.kitvid video{width:100%;display:block;max-height:50vh}
#kMsg,#kWa{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font:15px/1.5 inherit;font-family:inherit;background:var(--card);color:var(--fg);resize:vertical}
.kitgo{width:100%;font-size:16px;padding:14px;margin-top:2px}
#kflow{position:fixed;inset:0;z-index:200}
.kf-dim{position:absolute;inset:0;background:rgba(0,0,0,.45)}

<body>
<div class="wrap">
  <div class="sim"><div><b>Mode simulasi.</b> Kamu sekarang berperan sebagai <b id="role">Admin PGNet</b>. Tidak ada data yang tersimpan atau terkirim.</div><button class="btn btn-ghost btn-sm" id="reset" type="button">Ulangi</button></div>
  <div class="steps" aria-hidden="true"><span id="s1" class="on"></span><span id="s2"></span><span id="s3"></span><span id="s4"></span><span id="s5"></span><span id="s6"></span></div>
  <div id="app"></div>
</div>
<script>
var PDFLIB=(function(){
/**
 * NOTA & SURAT PERNYATAAN TRANSAKSI — PGNet
 * -------------------------------------------------------------
 * Alur:
 *  1. Admin buka web app (tanpa parameter) → login PIN → isi nota
 *     (tanggal, supplier, rekening, barang, kanal transaksi).
 *     Link HANYA dikirim jika barang sudah dites normal & sudah ditransfer lunas.
 *  2. Sistem membuat LINK khusus → dikirim ke supplier via WA.
 *  3. Supplier buka link → lihat Nota + Surat Pernyataan →
 *     tanda tangan 2x → PDF dibuat, disimpan di Drive,
 *     lalu supplier kirim PDF ke WA PGNet.
 *
 * Pemasangan: jalankan fungsi setup() sekali, lalu Deploy sebagai Web App
 * (Execute as: Me, Who has access: Anyone). Lihat CARA-PASANG.txt.
 */

const CONFIG = {
  NAMA_TOKO: 'PGNet',
  WA_PGNET: '6289605345210',      // 089605345210
  ADMIN_PIN: '1234',               // ← GANTI PIN ADMIN
  KOTA: 'Bogor',
  PDF_LINK_PUBLIC: true,           // true = link PDF bisa dibuka siapa saja yg punya link
  NAMA_FOLDER: 'Nota & Surat Pernyataan PGNet',
  NAMA_SPREADSHEET: 'Nota & Surat Pernyataan Transaksi',

  // --- Sumber data: tab Barang Masuk (spreadsheet TRANSAKSI) ---
  BM_SPREADSHEET_ID: '1dg3eiQJxmiccOuBAIyOzCfBzzGricgeFiiykZZugTOw',
  BM_SHEET: 'Barang Masuk',
  BM_START: '2026-11-01',          // hanya transaksi mulai tanggal ini
  CACHE_TTL: 300,                  // 5 menit
};

const KANAL_LIST = ['Marketplace', 'Datang Langsung', 'WhatsApp'];

const SHEET_NAME = 'Transaksi';
const HEADERS = [
  'ID', 'Token', 'No Nota', 'Tanggal', 'Nama Supplier', 'No WA Supplier',
  'Nama Rekening', 'Bank', 'No Rekening', 'Kanal', 'No Transaksi Marketplace',
  'Keterangan', 'Items (JSON)', 'Total',
  'Status', 'Dibuat', 'Ditandatangani', 'Link PDF',
  'Ref PUR', 'Subtotal Barang'
];
const COL = HEADERS.reduce((o, h, i) => (o[h] = i, o), {});

const STATUS_MENUNGGU = 'Menunggu TTD';
const STATUS_SELESAI = 'Sudah TTD';

/* ============================== SETUP ============================== */

function setup() {
  const props = PropertiesService.getScriptProperties();
  let ssId = props.getProperty('SS_ID');
  let ss;
  if (ssId) {
    ss = SpreadsheetApp.openById(ssId);
  } else {
    try { ss = SpreadsheetApp.getActiveSpreadsheet(); } catch (e) { ss = null; }
    if (!ss) ss = SpreadsheetApp.create(CONFIG.NAMA_SPREADSHEET);
    props.setProperty('SS_ID', ss.getId());
  }
  let sh = ss.getSheetByName(SHEET_NAME);
  if (!sh) sh = ss.insertSheet(SHEET_NAME);
  sh.getRange(1, 1, sh.getMaxRows(), HEADERS.length).setNumberFormat('@'); // simpan semua sebagai teks
  sh.getRange(1, 1, 1, HEADERS.length).setValues([HEADERS]).setFontWeight('bold').setBackground('#1f3a5f').setFontColor('#ffffff');
  sh.setFrozenRows(1);

  if (!props.getProperty('FOLDER_ID')) {
    const folder = DriveApp.createFolder(CONFIG.NAMA_FOLDER);
    props.setProperty('FOLDER_ID', folder.getId());
  }
  Logger.log('Spreadsheet: ' + ss.getUrl());
  Logger.log('Folder PDF : ' + DriveApp.getFolderById(props.getProperty('FOLDER_ID')).getUrl());
}

let SHEET_CACHE_ = null;
function getSheet_() {
  if (SHEET_CACHE_) return SHEET_CACHE_;
  const id = PropertiesService.getScriptProperties().getProperty('SS_ID');
  if (!id) throw new Error('Belum setup. Jalankan fungsi setup() dulu di editor Apps Script.');
  const sh = SpreadsheetApp.openById(id).getSheetByName(SHEET_NAME);
  // pastikan judul kolom baru (Ref PUR, Subtotal Barang) ada — 1x baca/tulis per rentang
  const head = sh.getRange(1, 1, 1, HEADERS.length).getDisplayValues()[0];
  if (head.join('|') !== HEADERS.join('|')) {
    sh.getRange(1, 1, 1, HEADERS.length).setValues([HEADERS]).setFontWeight('bold').setBackground('#1f3a5f').setFontColor('#ffffff');
  }
  SHEET_CACHE_ = sh;
  return sh;
}

function getFolder_() {
  const id = PropertiesService.getScriptProperties().getProperty('FOLDER_ID');
  return DriveApp.getFolderById(id);
}

/* ============================== WEB APP ============================== */

function doGet(e) {
  const token = e && e.parameter && e.parameter.t;
  let t;
  if (token) {
    const trx = findByToken_(String(token));
    t = HtmlService.createTemplateFromFile('Sign');
    t.payload = safeJson_(trx ? publicView_(trx) : null);
  } else {
    t = HtmlService.createTemplateFromFile('Admin');
    t.payload = safeJson_({ kanal: KANAL_LIST, url: webAppUrl_(), start: CONFIG.BM_START });
  }
  t.cfg = safeJson_({ nama: CONFIG.NAMA_TOKO, wa: CONFIG.WA_PGNET, kota: CONFIG.KOTA });
  return t.evaluate()
    .setTitle(token ? 'Nota & Surat Pernyataan' : 'Admin Nota ' + CONFIG.NAMA_TOKO)
    .addMetaTag('viewport', 'width=device-width, initial-scale=1, maximum-scale=1')
    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);
}

/* ============================== ADMIN API ============================== */

function checkPin_(pin) {
  if (String(pin) !== String(CONFIG.ADMIN_PIN)) throw new Error('PIN salah.');
}

function adminLogin(pin) {
  checkPin_(pin);
  return true;
}

function createTrx(pin, d) {
  checkPin_(pin);
  d = d || {};
  if (d.konfirmasi !== true) throw new Error('Centang konfirmasi: barang sudah dites normal & sudah ditransfer.');
  const token = /^[a-z0-9]{16,40}$/.test(String(d.token || '')) ? String(d.token) : Utilities.getUuid().replace(/-/g, '').slice(0, 20);
  let rec;
  if (d.pur) {
    // --- dari Barang Masuk: server penentu akhir (data barang diambil ulang dari sumber) ---
    const tx = findBMTx_(String(d.pur));
    if (!tx) throw new Error('Transaksi ' + d.pur + ' tidak ditemukan di Barang Masuk (mulai ' + CONFIG.BM_START + ').');
    const info = deriveBM_(tx);
    let kanal = info.kanal;
    if (!kanal) {
      if (['WhatsApp', 'Datang Langsung'].indexOf(d.kanal) < 0) throw new Error('Pilih kanal: WhatsApp atau Datang Langsung.');
      kanal = d.kanal;
    }
    const items = tx.items.map(i => ({ nama: i.nama, qty: i.qty, harga: i.harga, subtotal: i.qty * i.harga }));
    const subtotal = items.reduce((s, i) => s + i.subtotal, 0);
    const total = Math.round(Number(d.totalBayar) || subtotal);
    rec = { tanggal: tx.tgl, supplier: info.nama, namaRek: info.rek, bank: '', noRek: '', kanal: kanal,
            noTrxMp: info.inv, keterangan: info.platform, items: items, subtotal: subtotal, total: total, pur: tx.pur };
  } else {
    // --- input manual / tempel dari WA ---
    const tanggal = String(d.tanggal || '').trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(tanggal)) throw new Error('Tanggal wajib diisi.');
    if (KANAL_LIST.indexOf(d.kanal) < 0) throw new Error('Pilih kanal transaksi dulu.');
    const isMp = d.kanal === 'Marketplace';
    const supplier = String(d.supplier || '').trim();
    if (!supplier && !isMp) throw new Error('Nama supplier wajib diisi.');
    const namaRek = String(d.namaRek || '').trim() || (isMp ? 'Rekening Marketplace' : '');
    if (!namaRek) throw new Error('Nama rekening wajib diisi.');
    if (isMp && !String(d.noTrxMp || '').trim()) throw new Error('No. invoice marketplace wajib diisi.');
    const items = (d.items || [])
      .map(it => ({ nama: String(it.nama || '').trim(), qty: Number(it.qty) || 0, harga: Number(it.harga) || 0 }))
      .filter(it => it.nama && it.qty > 0);
    if (!items.length) throw new Error('Minimal 1 barang dengan qty > 0.');
    items.forEach(it => it.subtotal = it.qty * it.harga);
    const subtotal = items.reduce((s, it) => s + it.subtotal, 0);
    rec = { tanggal: tanggal, supplier: supplier, namaRek: namaRek, bank: String(d.bank || '').trim(), noRek: String(d.noRek || '').trim(),
            kanal: d.kanal, noTrxMp: isMp ? String(d.noTrxMp || '').trim() : '', keterangan: '', items: items,
            subtotal: subtotal, total: subtotal, pur: '' };
  }
  if (!(rec.total > 0)) throw new Error('Total dibayar harus lebih dari 0.');

  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    const sh = getSheet_();
    // penjaga entri kembar: token sama = kiriman ulang (kembalikan hasil lama), PUR sama = sudah pernah dibuat
    const sameTok = findRow_(sh, COL['Token'], token);
    if (sameTok) return resultFromRow_(sameTok.values);
    if (rec.pur) {
      const samePur = findRow_(sh, COL['Ref PUR'], rec.pur);
      if (samePur) throw new Error('DUPLIKAT: ' + rec.pur + ' sudah dibuat nota (' + samePur.values[COL['No Nota']] + ').');
    }
    const noNota = nextNoNota_(sh, rec.tanggal);
    const now = Utilities.formatDate(new Date(), tz_(), 'yyyy-MM-dd HH:mm:ss');
    const row = new Array(HEADERS.length).fill('');
    row[COL['ID']] = Utilities.getUuid();
    row[COL['Token']] = token;
    row[COL['No Nota']] = noNota;
    row[COL['Tanggal']] = rec.tanggal;
    row[COL['Nama Supplier']] = rec.supplier;
    row[COL['No WA Supplier']] = normWa_(d.waSupplier);
    row[COL['Nama Rekening']] = rec.namaRek;
    row[COL['Bank']] = rec.bank;
    row[COL['No Rekening']] = rec.noRek;
    row[COL['Kanal']] = rec.kanal;
    row[COL['No Transaksi Marketplace']] = rec.noTrxMp;
    row[COL['Keterangan']] = rec.keterangan;
    row[COL['Items (JSON)']] = JSON.stringify(rec.items);
    row[COL['Total']] = String(rec.total);
    row[COL['Status']] = STATUS_MENUNGGU;
    row[COL['Dibuat']] = now;
    row[COL['Ref PUR']] = rec.pur;
    row[COL['Subtotal Barang']] = String(rec.subtotal);
    const at = sh.getLastRow() + 1;
    sh.getRange(at, 1, 1, HEADERS.length).setNumberFormat('@').setValues([row]); // tulis 1 rentang
    return resultFromRow_(row);
  } finally {
    lock.releaseLock();
  }
}

function resultFromRow_(v) {
  return { noNota: v[COL['No Nota']], link: webAppUrl_() + '?t=' + v[COL['Token']], token: v[COL['Token']],
           waSupplier: v[COL['No WA Supplier']], pur: v[COL['Ref PUR']] || '' };
}

function listTrx(pin) {
  checkPin_(pin);
  const sh = getSheet_();
  const last = sh.getLastRow();
  if (last < 2) return [];
  const from = Math.max(2, last - 299);                 // cukup 300 nota terakhir
  const vals = sh.getRange(from, 1, last - from + 1, HEADERS.length).getDisplayValues();
  const base = webAppUrl_();
  return vals.filter(r => r[COL['ID']]).map(r => ({
    id: r[COL['ID']],
    noNota: r[COL['No Nota']],
    tanggal: r[COL['Tanggal']],
    supplier: r[COL['Nama Supplier']],
    waSupplier: r[COL['No WA Supplier']],
    kanal: r[COL['Kanal']],
    noTrxMp: r[COL['No Transaksi Marketplace']],
    total: Number(r[COL['Total']]) || 0,
    pur: r[COL['Ref PUR']] || '',
    status: r[COL['Status']],
    signedAt: r[COL['Ditandatangani']],
    pdf: r[COL['Link PDF']],
    link: base + '?t=' + r[COL['Token']],
  })).reverse();
}

function deleteTrx(pin, id) {
  checkPin_(pin);
  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    const sh = getSheet_();
    const found = findRow_(sh, COL['ID'], id);
    if (!found) throw new Error('Transaksi tidak ditemukan.');
    if (found.values[COL['Status']] === STATUS_SELESAI) throw new Error('Transaksi yang sudah ditandatangani tidak bisa dihapus.');
    sh.deleteRow(found.row);
    return true;
  } finally {
    lock.releaseLock();
  }
}

/* ============================== SUPPLIER API ============================== */

function submitSignature(token, sigNota, sigPernyataan) {
  const re = /^data:image\/png;base64,[A-Za-z0-9+/=]+$/;
  if (!re.test(sigNota || '') || !re.test(sigPernyataan || '')) throw new Error('Tanda tangan belum lengkap.');
  if (sigNota.length > 1500000 || sigPernyataan.length > 1500000) throw new Error('Ukuran tanda tangan terlalu besar.');

  const lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    const sh = getSheet_();
    const found = findRow_(sh, COL['Token'], token);
    if (!found) throw new Error('Link tidak valid.');
    const trx = rowToTrx_(found.values);
    if (trx.status === STATUS_SELESAI) {
      return { already: true, url: trx.pdf, fileName: fileName_(trx) };
    }
    const signedAt = Utilities.formatDate(new Date(), tz_(), 'yyyy-MM-dd HH:mm:ss');
    const html = buildPdfHtml_(trx, sigNota, sigPernyataan, signedAt);
    const blob = Utilities.newBlob(html, 'text/html', 'nota.html').getAs('application/pdf').setName(fileName_(trx));
    const file = getFolder_().createFile(blob);
    if (CONFIG.PDF_LINK_PUBLIC) {
      try { file.setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW); } catch (e) { /* domain policy */ }
    }
    const url = file.getUrl();
    // tulis Status..Link PDF sekaligus (1 rentang, bukan per sel)
    const c0 = COL['Status'], seg = found.values.slice(c0, COL['Link PDF'] + 1);
    seg[0] = STATUS_SELESAI;
    seg[COL['Ditandatangani'] - c0] = signedAt;
    seg[COL['Link PDF'] - c0] = url;
    sh.getRange(found.row, c0 + 1, 1, seg.length).setValues([seg]);
    return {
      already: false,
      url: url,
      fileName: fileName_(trx),
      base64: Utilities.base64Encode(blob.getBytes()),
    };
  } finally {
    lock.releaseLock();
  }
}

/* ============================== PDF ============================== */

function buildPdfHtml_(t, sigNota, sigPernyataan, signedAt) {
  const rows = t.items.map((it, i) =>
    '<tr><td class="c">' + (i + 1) + '</td><td>' + esc_(it.nama) + '</td><td class="c">' + it.qty +
    '</td><td class="r">' + rp_(it.harga) + '</td><td class="r">' + rp_(it.subtotal) + '</td></tr>').join('');


  const rekLine = esc_(t.namaRek) + (t.bank ? ' — ' + esc_(t.bank) : '') + (t.noRek ? ' ' + esc_(t.noRek) : '');
  const kanalLine = kanalText_(t);

  const css =
    'body{font-family:Arial,Helvetica,sans-serif;font-size:11pt;color:#111;margin:0}' +
    '.page{padding:6px 4px}' +
    'h1{font-size:16pt;margin:0 0 2px 0;letter-spacing:1px}' +
    '.muted{color:#555;font-size:9.5pt}' +
    '.hdr{border-bottom:2px solid #1f3a5f;padding-bottom:6px;margin-bottom:12px}' +
    'table{border-collapse:collapse;width:100%}' +
    '.info td{padding:3px 4px;vertical-align:top}' +
    '.items th{background:#e3e8ef;color:#111;padding:6px;font-size:10pt;border:1px solid #888}' +
    '.items td{border:1px solid #bbb;padding:5px 6px;font-size:10pt}' +
    '.c{text-align:center}.r{text-align:right}' +
    '.sig{width:240px;text-align:center;margin-left:auto;margin-top:18px}' +
    '.sig img{width:200px;height:auto}' +
    '.line{border-top:1px solid #111;padding-top:3px;font-weight:bold}' +
    'ol li{margin-bottom:6px}' +
    'p{line-height:1.5;margin:6px 0}';

  const sigBlock = (img, label) =>
    '<div class="sig"><div>' + label + '</div><img src="' + img + '"/><div class="line">' + (esc_(t.supplier) || '&nbsp;') + '</div></div>';
  const isMp = t.kanal === 'Marketplace';
  const bayarLine = isMp ? '<b>LUNAS</b>, dibayar melalui marketplace' : '<b>LUNAS</b>, ditransfer ke rekening di atas';
  const supLabel = isMp ? 'Nama Toko' : 'Nama Supplier / Penjual';

  const nota =
    '<div class="page">' +
    '<div class="hdr"><h1>NOTA PEMBELIAN</h1><div class="muted">' + esc_(CONFIG.NAMA_TOKO) + ' · ' + esc_(CONFIG.KOTA) + '</div></div>' +
    '<table class="info">' +
    '<tr><td width="34%">No. Nota</td><td>: <b>' + esc_(t.noNota) + '</b>' + (t.pur ? ' <span class="muted">(Ref. ' + esc_(t.pur) + ')</span>' : '') + '</td></tr>' +
    '<tr><td>Tanggal</td><td>: ' + tglIndo_(t.tanggal) + '</td></tr>' +
    (t.supplier ? '<tr><td>' + supLabel + '</td><td>: ' + esc_(t.supplier) + '</td></tr>' : '') +
    '<tr><td>Nama Rekening</td><td>: ' + rekLine + '</td></tr>' +
    '<tr><td>Transaksi melalui</td><td>: ' + kanalLine + '</td></tr>' +
    '<tr><td>Pembayaran</td><td>: ' + bayarLine + '</td></tr>' +
    '</table><br/>' +

function rowToTrx_(r) {
  let items = [];
  try { items = JSON.parse(r[COL['Items (JSON)']] || '[]'); } catch (e) {}
  return {
    id: r[COL['ID']],
    token: r[COL['Token']],

    tanggal: toIso_(r[COL['Tanggal']]),
    supplier: r[COL['Nama Supplier']],
    waSupplier: r[COL['No WA Supplier']],
    namaRek: r[COL['Nama Rekening']],
    bank: r[COL['Bank']],
    noRek: r[COL['No Rekening']],
    kanal: r[COL['Kanal']],
    noTrxMp: r[COL['No Transaksi Marketplace']],
    keterangan: r[COL['Keterangan']],
    items: items,
    total: Number(r[COL['Total']]) || 0,
    subtotal: Number(r[COL['Subtotal Barang']]) || 0,
    pur: r[COL['Ref PUR']] || '',
    status: r[COL['Status']],
    signedAt: String(r[COL['Ditandatangani']] || ''),
    pdf: r[COL['Link PDF']],
  };
}

function publicView_(t) {
  const v = Object.assign({}, t);
  delete v.id;            // token tetap dikirim (dipakai saat submit TTD)
  v.kanalText = kanalTextPlain_(t);
  return v;
}

function findByToken_(token) {
  const sh = getSheet_();
  const found = findRow_(sh, COL['Token'], token);
  if (!found) return null;
  const t = rowToTrx_(found.values);
  t.token = token;
  return t;
}

function findRow_(sh, colIdx, value) {
  const last = sh.getLastRow();
  if (last < 2 || !value) return null;
  // cari pakai TextFinder (cepat), lalu baca 1 baris saja
  const cell = sh.getRange(2, colIdx + 1, last - 1, 1).createTextFinder(String(value)).matchEntireCell(true).matchCase(true).findNext();
  if (!cell) return null;
  const row = cell.getRow();
  return { row: row, values: sh.getRange(row, 1, 1, HEADERS.length).getDisplayValues()[0] };
}

function nextNoNota_(sh, tanggalIso) {
  const prefix = 'PGN-' + tanggalIso.replace(/-/g, '') + '-';
  const last = sh.getLastRow();
  let max = 0;
  if (last >= 2) {
    const from = Math.max(2, last - 999);                 // nomor per tanggal: cukup 1000 baris terakhir
    sh.getRange(from, COL['No Nota'] + 1, last - from + 1, 1).getDisplayValues().forEach(r => {
      if (r[0].indexOf(prefix) === 0) max = Math.max(max, Number(r[0].slice(prefix.length)) || 0);
    });
  }
  return prefix + ('00' + (max + 1)).slice(-3);
}

function kanalTextPlain_(t) {
  // Keterangan = nama platform dari kolom C Barang Masuk (Shopee, Tokopedia, TOCO, ...)
  let s = t.kanal === 'Marketplace' && t.keterangan ? t.keterangan : (t.kanal || '-');
  if (t.noTrxMp) s += ', No. Invoice ' + t.noTrxMp;
  return s;
}

function kanalText_(t) { return esc_(kanalTextPlain_(t)); }

function fileName_(t) {
  const who = t.supplier || t.noTrxMp || '';
  return 'Nota & Pernyataan ' + t.noNota + (who ? ' - ' + String(who).replace(/[\\/:*?"<>|]/g, '') : '') + '.pdf';
}

function webAppUrl_() { return ScriptApp.getService().getUrl(); }
function tz_() { return Session.getScriptTimeZone() || 'Asia/Jakarta'; }

function toIso_(v) {
  if (!v) return '';
  if (v instanceof Date) return Utilities.formatDate(v, tz_(), 'yyyy-MM-dd');
  const s = String(v).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); // dd/mm/yyyy
  if (m) return m[3] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[1]).slice(-2);
  return s;
}

function tglIndo_(iso) {
  const BLN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return esc_(iso);
  return Number(m[3]) + ' ' + BLN[Number(m[2]) - 1] + ' ' + m[1];
}

function rp_(n) {
  return 'Rp ' + Math.round(Number(n) || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

function normWa_(v) {
  let s = String(v || '').replace(/[^\d]/g, '');
  if (!s) return '';
  if (s.indexOf('0') === 0) s = '62' + s.slice(1);
  else if (s.indexOf('8') === 0) s = '62' + s;
  return s;
}

function esc_(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function safeJson_(o) {
  return JSON.stringify(o).replace(/</g, '\\u003c').replace(/>/g, '\\u003e').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029');
}

/** Dipanggil halaman admin saat buka & tiap 4 menit (hanya kalau tab terlihat). */
function getBM(pin, force) {
  checkPin_(pin);
  const data = getBMData_(!!force);
  const notes = notaByPur_();
  // semua transaksi dikirim; yang sudah dibuat nota diberi info nota (untuk tab "Sudah dibuat")
  const tx = data.tx.map(t => notes[t.pur] ? Object.assign({}, t, { nota: notes[t.pur] }) : t);
  return { tx: tx, at: data.at, stale: data.stale || '', start: CONFIG.BM_START };
}

/** Info nota per Ref PUR — dibaca per rentang sempit (2 blok kolom), bukan per sel. */
function notaByPur_() {
  const sh = getSheet_();
  const last = sh.getLastRow(), out = {};
  if (last < 2) return out;
  const a0 = COL['Token'], a1 = COL['No WA Supplier'];          // Token..No WA
  const b0 = COL['Total'], b1 = COL['Ref PUR'];                 // Total..Ref PUR
  const A = sh.getRange(2, a0 + 1, last - 1, a1 - a0 + 1).getDisplayValues();
  const B = sh.getRange(2, b0 + 1, last - 1, b1 - b0 + 1).getDisplayValues();
  const base = webAppUrl_();
  for (let i = 0; i < B.length; i++) {
    const pur = B[i][b1 - b0];
    if (!pur) continue;
    out[pur] = { noNota: A[i][COL['No Nota'] - a0], token: A[i][0], wa: A[i][a1 - a0], link: base + '?t=' + A[i][0],
                 total: Number(B[i][0]) || 0, status: B[i][COL['Status'] - b0] };
  }
  return out;
}

function findBMTx_(pur) {
  let data = getBMData_(false);
  let t = data.tx.filter(x => x.pur === pur)[0];
  if (!t) { data = getBMData_(true); t = data.tx.filter(x => x.pur === pur)[0]; }
  return t || null;
}

/** Cache 5 menit (dipotong ±90 KB) + salinan "data baik terakhir" 6 jam untuk pengaman. */
function getBMData_(force) {
  const cache = CacheService.getScriptCache();
  if (!force) {
    const c = getChunked_(cache, 'bm');
    if (c) return JSON.parse(c);
  }
  let fresh = null, bad = '';
  try { fresh = readBMFresh_(); } catch (e) { bad = 'Gagal membaca Barang Masuk: ' + e.message; }
  const goodStr = getChunked_(cache, 'bm_good');
  const good = goodStr ? JSON.parse(goodStr) : null;
  if (fresh && fresh.corrupt) bad = 'Data sumber berisi ' + fresh.corrupt;
  if (fresh && !bad && good && good.tx.length >= 4 && fresh.tx.length < good.tx.length * 0.5)
    bad = 'Jumlah transaksi anjlok (' + fresh.tx.length + ' dari ' + good.tx.length + ')';
  let out;
  if (bad) {
    if (!good) throw new Error(bad + '. Coba lagi sebentar.');
    out = { tx: good.tx, at: good.at, stale: bad + ' — memakai data terakhir yang baik.' };
  } else {
    out = { tx: fresh.tx, at: fresh.at };
    putChunked_(cache, 'bm_good', JSON.stringify(out), 21600);
  }
  putChunked_(cache, 'bm', JSON.stringify(out), CONFIG.CACHE_TTL);
  return out;
}

/** Baca dari bawah ke atas per blok 1.500 baris (B:M sekaligus) sampai tanggal < BM_START. */
function readBMFresh_() {
  const sh = SpreadsheetApp.openById(CONFIG.BM_SPREADSHEET_ID).getSheetByName(CONFIG.BM_SHEET);
  if (!sh) throw new Error('Tab "' + CONFIG.BM_SHEET + '" tidak ditemukan');
  const BAD = /^(#REF!|#N\/A|#VALUE!|#ERROR!|#NAME\?|#DIV\/0!|Loading)/i;
  let end = sh.getLastRow(), rows = [], corrupt = '';
  const CHUNK = 1500;
  outer:
  while (end >= 2) {
    const start = Math.max(2, end - CHUNK + 1);
    const vals = sh.getRange(start, 2, end - start + 1, 12).getDisplayValues(); // kolom B..M
    for (let i = vals.length - 1; i >= 0; i--) {
      const r = vals[i];
      if (!r[3]) continue;                                   // kolom E (No. PUR) kosong → lewati
      const iso = parseTglId_(r[0]);
      if (!iso) { if (BAD.test(r[0])) corrupt = r[0]; continue; }
      if (iso < CONFIG.BM_START) break outer;
      for (let k = 0; k < r.length; k++) if (BAD.test(r[k])) { corrupt = r[k]; break; }
      rows.push(r);
    }
    end = start - 1;
  }
  rows.reverse();
  const tx = [], idx = {};
  rows.forEach(r => {
    // r: 0=B tgl, 1=C jenis, 2=D nama, 3=E PUR, 4=F kode, 5=G, 6=H kategori, 7=I barang, 8=J qty, 9=K, 10=L, 11=M harga
    const pur = r[3].trim();
    if (!(pur in idx)) { idx[pur] = tx.length; tx.push({ pur: pur, tgl: parseTglId_(r[0]), tglText: r[0], jenis: r[1].trim(), d: r[2].trim(), items: [], total: 0 }); }
    const t = tx[idx[pur]];
    const qty = numId_(r[8]), harga = numId_(r[11]);
    t.items.push({ nama: r[7].trim(), qty: qty, harga: harga });
    t.total += qty * harga;
  });
  return { tx: tx, at: Date.now(), corrupt: corrupt };
}

/** Aturan nama/kanal dari kolom C & D (sama persis dengan di halaman admin). */
function deriveBM_(t) {
  const platform = String(t.jenis || '').trim();
  const isDirect = !platform || /^direct$/i.test(platform);
  const parts = String(t.d || '').split('/').map(s => s.trim()).filter(Boolean);
  const first = parts[0] || '';
  const PRE = /^(SP|TC|TP)\s+(.+)$/i;
  const isInv = /^[A-Za-z0-9]{8,}$/.test(first) && /\d/.test(first) && !/^[A-Za-z]+$/.test(first);
  if (isInv) {
    let toko = '';
    parts.slice(1).forEach(p => { const m = p.match(PRE); if (m && !toko) toko = m[2].trim(); });
    return { kanal: 'Marketplace', platform: isDirect ? '' : platform, inv: first, nama: toko, rek: 'Rekening Marketplace' };
  }
  if (!isDirect) {
    const m = first.match(PRE);
    return { kanal: 'Marketplace', platform: platform, inv: '', nama: m ? m[2].trim() : first, rek: 'Rekening Marketplace' };
  }
  return { kanal: '', platform: '', inv: '', nama: first, rek: first };
}

function parseTglId_(s) {
  const BL = { januari: 1, februari: 2, maret: 3, april: 4, mei: 5, juni: 6, juli: 7, agustus: 8, september: 9, oktober: 10, november: 11, desember: 12 };
  s = String(s || '').trim();
  let m = s.match(/(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/);
  if (m && BL[m[2].toLowerCase()]) return m[3] + '-' + ('0' + BL[m[2].toLowerCase()]).slice(-2) + '-' + ('0' + m[1]).slice(-2);
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return m[3] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[1]).slice(-2);
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[0] : '';
}

function numId_(s) { return Number(String(s || '').replace(/[^\d]/g, '')) || 0; }

function putChunked_(cache, key, str, ttl) {
  const SIZE = 30000;                                   // ≤ ±90 KB per potong (aman untuk huruf non-ASCII)
  const n = Math.max(1, Math.ceil(str.length / SIZE)), obj = {};
  for (let i = 0; i < n; i++) obj[key + '_' + i] = str.substr(i * SIZE, SIZE);
  obj[key + '_n'] = String(n);
  cache.putAll(obj, ttl);
}

function getChunked_(cache, key) {
  const n = Number(cache.get(key + '_n'));
  if (!n) return null;
  const keys = [];
  for (let i = 0; i < n; i++) keys.push(key + '_' + i);
  const got = cache.getAll(keys);
  let s = '';
  for (let i = 0; i < keys.length; i++) { if (got[keys[i]] == null) return null; s += got[keys[i]]; }
  return s;
}

function parsePaste(){

  var pm=document.getElementById('pmsg');

function makePad(cv){
  var ctx=cv.getContext('2d'),drawing=false,last=null,empty=true;
  function setup(){var r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#0b1b33';ctx.fillStyle='#0b1b33';empty=true;cv.classList.remove('signed');}
  function pos(e){var r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
  function start(p){drawing=true;last=p;ctx.beginPath();ctx.arc(p.x,p.y,1.1,0,7);ctx.fill();empty=false;cv.classList.add('signed');}
  function move(p){if(!drawing)return;ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;}
  var opt={passive:false};
  cv.addEventListener('touchstart',function(e){e.preventDefault();start(pos(e.touches[0]));},opt);
  cv.addEventListener('touchmove',function(e){e.preventDefault();move(pos(e.touches[0]));},opt);
  cv.addEventListener('touchend',function(e){e.preventDefault();drawing=false;},opt);
  cv.addEventListener('touchcancel',function(){drawing=false;},opt);
  cv.addEventListener('pointerdown',function(e){if(e.pointerType==='touch')return;e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}start(pos(e));});
  cv.addEventListener('pointermove',function(e){if(e.pointerType==='touch'||!drawing)return;e.preventDefault();move(pos(e));});
  ['pointerup','pointercancel'].forEach(function(ev){cv.addEventListener(ev,function(e){if(e.pointerType!=='touch')drawing=false;});});
  setup();var lastW=cv.getBoundingClientRect().width;window.addEventListener('resize',function(){var w=cv.getBoundingClientRect().width;if(empty&&Math.abs(w-lastW)>1){lastW=w;setup();}});
  return {clear:function(){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);setup();},isEmpty:function(){return empty;},
    png:function(){var w=600,h=Math.round(cv.height*w/cv.width),o=document.createElement('canvas');o.width=w;o.height=h;var c=o.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,w,h);c.drawImage(cv,0,0,w,h);return o.toDataURL('image/png');}};
}

function initPull(){
  var p=document.getElementById('pull'),h=document.getElementById('pullH');
  var vh=function(){return window.innerHeight;};
  var snaps=function(){return [150,Math.round(vh()*0.55),Math.round(vh()*0.9)];};
  if(PULL_H==null)PULL_H=snaps()[1];
  p.style.height=PULL_H+'px';
  var startY=0,startH=0,drag=false,moved=false;
  h.addEventListener('pointerdown',function(e){drag=true;moved=false;startY=e.clientY;startH=p.offsetHeight;p.classList.add('dragging');try{h.setPointerCapture(e.pointerId);}catch(_){}});
  h.addEventListener('pointermove',function(e){if(!drag)return;var dy=e.clientY-startY;if(Math.abs(dy)>4)moved=true;var nh=Math.max(110,Math.min(vh()*0.94,startH-dy));p.style.height=nh+'px';});
  function end(){if(!drag)return;drag=false;p.classList.remove('dragging');var cur=p.offsetHeight,s=snaps();
    if(!moved){var i=s.indexOf(PULL_H);cur=s[(i+1)%s.length]||s[1];}
    var best=s.reduce(function(a,b){return Math.abs(b-cur)<Math.abs(a-cur)?b:a;});PULL_H=best;p.style.height=best+'px';}
  h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);
}

    detailHTML(t,true)+inputsHTML(t)+'<button type="button" class="btn btn-primary" id="q_go">Buat Link &amp; Kirim ke Supplier</button></div>';
  document.body.appendChild(w);
  w.querySelector('.dim').onclick=closeSheet;w.querySelector('.xbtn').onclick=closeSheet;
  bindInputs(t);document.getElementById('q_go').onclick=function(){submitFrom(t);};
  requestAnimationFrame(function(){w.classList.add('open');});
}
function closeSheet(){var w=document.getElementById('sheetwrap');if(w)w.remove();}

/* --- B: Langkah 1-2-3 --- */
function viewB(){
  var steps=['Pilih transaksi','Cek nota','Kirim'];
  var bar='<div class="wiz">'+steps.map(function(s,i){return '<div class="wz'+(i+1<=bStep?' on':'')+'"><span>'+(i+1)+'</span>'+s+'</div>';}).join('')+'</div>';
  var body='';
  if(bStep===1){body='<div class="card">'+note()+searchHTML('sb')+'<div id="lb" class="txlist">'+txListHTML('')+'</div></div>';}
  else if(bStep===2){body='<div class="card">'+detailHTML(bT)+'<p class="hint">Data diambil apa adanya dari Barang Masuk. Kalau ada yang salah, perbaiki di sheet.</p>'+
    '<div class="row2b"><button type="button" class="btn btn-ghost" id="bk">← Ganti</button><button type="button" class="btn btn-primary" id="nx">Lanjut →</button></div></div>';}
  else{body='<div class="card"><div class="mini">'+esc(bmTitle(bT))+' · <b>'+rp(bT.total)+'</b></div>'+inputsHTML(bT)+
    '<div class="row2b"><button type="button" class="btn btn-ghost" id="bk">← Kembali</button><button type="button" class="btn btn-primary" id="q_go">Buat Link</button></div></div>';}
  app.innerHTML=modeBar()+bar+body;bindMode();
  if(bStep===1){var s=document.getElementById('sb');var pick=function(t){bT=t;bStep=2;viewB();};s.oninput=function(){document.getElementById('lb').innerHTML=txListHTML(s.value);bindTx(pick);};bindTx(pick);}
  if(bStep===2){document.getElementById('bk').onclick=function(){bStep=1;viewB();};document.getElementById('nx').onclick=function(){bStep=3;viewB();};}
  if(bStep===3){bindInputs();document.getElementById('bk').onclick=function(){bStep=2;viewB();};document.getElementById('q_go').onclick=function(){if(submitFrom(bT)){bStep=1;bT=null;}};}
}

/* --- C: Satu layar ringkas --- */
function viewC(){
  var top=modeBar()+'<div class="card">'+note()+
    (cT?'<button type="button" class="picked" id="chg"><span><span class="muted">Transaksi</span><br><b>'+esc(bmTitle(cT))+'</b> · '+cT.pur+'</span><span class="chg">Ganti</span></button>':
        searchHTML('sc')+'<div id="lc" class="txlist short">'+txListHTML('')+'</div>')+'</div>';
  var rest=cT?'<div class="card">'+detailHTML(cT,true)+inputsHTML(cT)+'</div><div class="stickybar"><div><span class="muted">Total</span><br><b>'+rp(cT.total)+'</b></div><button type="button" class="btn btn-primary" id="q_go">Buat Link</button></div>':'';
  app.innerHTML=top+rest;bindMode();
  if(!cT){var s=document.getElementById('sc');var pick=function(t){cT=t;viewC();};s.oninput=function(){document.getElementById('lc').innerHTML=txListHTML(s.value);bindTx(pick);};bindTx(pick);}
  else{document.getElementById('chg').onclick=function(){cT=null;viewC();};bindInputs();document.getElementById('q_go').onclick=function(){if(submitFrom(cT))cT=null;};}
}

document.getElementById('reset').onclick=restart;
viewAdmin();

/* ---- Chat ke penjual (simulasi) ---- */
var KIT_MSG='Maaf bang saat ini saya perlu ada nota dan surat pernyataan, jika *selesai transaksi*\n\nNanti kita yang buat nota dan surat pernyataan, abang ttd aja';
function kitCopy(t,btn){
  var done=function(){var o=btn.textContent;btn.textContent='✓ Tersalin';setTimeout(function(){btn.textContent=o;},1400);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,function(){fb();});}else fb();
  function fb(){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}ta.remove();done();}
}
function waFmt(t){return esc(t).replace(/\*([^*\n]+)\*/g,'<b>$1</b>').replace(/\n/g,'<br>');}
function openKit(){
  closeSheet();
  var w=document.createElement('div');w.id='sheetwrap';
  w.innerHTML='<div class="dim"></div><div class="sheet" role="dialog" aria-label="Chat ke penjual"><div class="grab"></div><button type="button" class="xbtn" aria-label="Tutup">×</button>'+
   '<h3 style="margin:4px 0 8px">Chat ke penjual</h3>'+
   '<textarea id="kMsg" rows="5" aria-label="Pesan"></textarea>'+
   '<div class="kitvid"><video src="tutorial-20detik.mp4" controls playsinline preload="metadata"></video></div>'+
   '<button type="button" class="btn btn-wa kitgo" id="kGo">Kirim pesan + video ke WhatsApp</button>'+
   '<p class="hint" style="margin:6px 0">Pilih WhatsApp → pilih chat penjual → kirim. Pesan ikut jadi keterangan video.</p>'+
   '<div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn btn-ghost btn-sm" id="kCopy">Salin pesan</button><button type="button" class="btn btn-ghost btn-sm" id="kDl">⬇ Download video</button></div></div>';
  document.body.appendChild(w);
  w.querySelector('.dim').onclick=closeSheet;w.querySelector('.xbtn').onclick=closeSheet;
  var m=document.getElementById('kMsg');m.value=KIT_MSG;
  document.getElementById('kCopy').onclick=function(){kitCopy(m.value,this);};
  document.getElementById('kDl').onclick=function(){var b=this;b.textContent='✓ Di aplikasi asli: video tersimpan ke HP';setTimeout(function(){b.textContent='⬇ Download video';},2200);};
  document.getElementById('kGo').onclick=function(){kitFlow(m.value,1);};
  requestAnimationFrame(function(){w.classList.add('open');});
}
var KIT_CONTACTS=[['Budi Santoso','Penjual · Datang Langsung'],['Ari Komputer','Penjual · WhatsApp'],['Kak Sri','Admin'],['Grup PGNet','12 anggota']];
function kitFlow(msg,step,who){
  var o=document.getElementById('kflow');if(!o){o=document.createElement('div');o.id='kflow';document.body.appendChild(o);}
  var html='';
  if(step===1){
    var apps=[['WhatsApp','#25d366','W'],['WA Business','#128c7e','B'],['Telegram','#2aabee','T'],['Gmail','#d93025','M'],['Drive','#1a73e8','D'],['Simpan','#5f6368','↓']];
    html='<div class="kf-dim"></div><div class="kf-share"><div class="grab"></div><div class="kf-t">Bagikan</div>'+
      '<div class="kf-file"><video src="tutorial-20detik.mp4" muted preload="metadata"></video><div><b>Tutorial-Supplier-PGNet.mp4</b><div class="hint" style="margin:0">Video · 4,5 MB + pesan</div></div></div>'+
      '<div class="kf-apps">'+apps.map(function(a,i){return '<button type="button" class="kf-app'+(i?' off':'')+'" data-i="'+i+'"><span style="background:'+a[1]+'">'+a[2]+'</span>'+a[0]+'</button>';}).join('')+'</div>'+
      '<p class="hint" style="text-align:center;margin:6px 0 0">Ini menu bagikan bawaan HP — ketuk <b>WhatsApp</b>.</p></div>';
  }else if(step===2){
    html='<div class="kf-full"><div class="kf-bar"><button type="button" class="kf-back">←</button><div><b>Kirim ke…</b><div style="font-size:12px;opacity:.85">Pilih chat penjual</div></div></div>'+
      '<div class="kf-list">'+KIT_CONTACTS.map(function(c,i){return '<button type="button" class="kf-c" data-i="'+i+'"><span class="kf-av">'+esc(c[0][0])+'</span><span><b>'+esc(c[0])+'</b><br><small>'+esc(c[1])+'</small></span></button>';}).join('')+'</div></div>';
  }else if(step===3){
    var c=KIT_CONTACTS[who];
    html='<div class="kf-full"><div class="kf-bar"><button type="button" class="kf-back">←</button><div><b>'+esc(c[0])+'</b></div></div>'+
      '<div class="kf-chat"><div class="kf-prev"><video src="tutorial-20detik.mp4" muted preload="metadata"></video></div>'+
      '<div class="kf-cap">'+waFmt(msg)+'</div></div>'+
      '<div class="kf-send"><span class="hint" style="margin:0">Pesan otomatis jadi keterangan video</span><button type="button" class="kf-sbtn" aria-label="Kirim">➤</button></div></div>';
  }else{
    var c2=KIT_CONTACTS[who];
    html='<div class="kf-full"><div class="kf-bar"><button type="button" class="kf-back">←</button><div><b>'+esc(c2[0])+'</b></div></div>'+
      '<div class="kf-chat"><div class="kf-bub"><video src="tutorial-20detik.mp4" controls playsinline preload="metadata"></video><div class="kf-btxt">'+waFmt(msg)+'</div><div class="kf-time">'+new Date().toTimeString().slice(0,5)+' ✓✓</div></div></div>'+
      '<div class="kf-done"><b>✓ Terkirim.</b> Begini yang diterima penjual — pesan + video dalam satu kali kirim.<button type="button" class="btn btn-primary btn-sm kf-close">Selesai</button></div></div>';
  }
  o.innerHTML=html;
  var q=function(s){return o.querySelector(s);};
  if(step===1){q('.kf-dim').onclick=function(){o.remove();};o.querySelector('[data-i="0"]').onclick=function(){kitFlow(msg,2);};}
  if(step===2){q('.kf-back').onclick=function(){kitFlow(msg,1);};o.querySelectorAll('.kf-c').forEach(function(b){b.onclick=function(){kitFlow(msg,3,+b.getAttribute('data-i'));};});}
  if(step===3){q('.kf-back').onclick=function(){kitFlow(msg,2);};q('.kf-sbtn').onclick=function(){kitFlow(msg,4,who);};}
  if(step===4){q('.kf-back').onclick=function(){o.remove();};q('.kf-close').onclick=function(){o.remove();closeSheet();};}
}
</script>
